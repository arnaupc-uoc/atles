services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: atles
      POSTGRES_USER: atles
      POSTGRES_PASSWORD: atles_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atles -d atles"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: development
      DATABASE_URL: postgresql://atles:atles_dev@db:5432/atles
      SECRET_KEY: dev_secret_key_change_in_prod

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend


volumes:
  pgdata:
