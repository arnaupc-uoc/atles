{% extends "base.html" %}

{% block title %}Restablir contrasenya - Atles Administració{% endblock %}

{% block content %}
<div class="card">
  <h1>Restablir contrasenya</h1>
  {% if error %}
  <div class="alert error">{{ error }}</div>
  {% endif %}
  <form method="post">
    <label for="password">Nova contrasenya</label>
    <input id="password" name="password" type="password" required autofocus />

    <label for="confirm_password">Confirma la contrasenya</label>
    <input id="confirm_password" name="confirm_password" type="password" required />

    <button class="button" type="submit">Canvia la contrasenya</button>
  </form>
  <p style="margin-top: 1rem;"><a href="{{ url_for('admin.login') }}">Tornar al login</a></p>
</div>
{% endblock %}
