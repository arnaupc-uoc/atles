{% extends "base.html" %}

{% block title %}Restablir contrasenya - Atles Administració{% endblock %}

{% block content %}
<v-card elevation="2" class="pa-6 mx-auto" style="max-width: 520px;">
  <v-card-title>Restablir contrasenya</v-card-title>
  {% if error %}
    <v-alert type="error" class="mb-4" prominent>{{ error }}</v-alert>
  {% endif %}
  <form method="post">
    <v-text-field id="password" name="password" label="Nova contrasenya" type="password" required autofocus></v-text-field>
    <v-text-field id="confirm_password" name="confirm_password" label="Confirma la contrasenya" type="password" required></v-text-field>
    <v-card-actions class="pt-4">
      <v-btn color="primary" type="submit">Canvia la contrasenya</v-btn>
    </v-card-actions>
  </form>
  <v-btn variant="text" href="{{ url_for('admin.login') }}">Tornar al login</v-btn>
</v-card>
{% endblock %}
