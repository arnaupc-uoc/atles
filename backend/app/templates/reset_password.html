{% extends "base.html" %}

{% block title %}Restablir contrasenya - Atles Administració{% endblock %}

{% block content %}
<q-card elevation="2" class="q-pa-lg q-mx-auto" style="max-width: 520px;">
  <q-card-section class="text-h6">Restablir contrasenya</q-card-section>
  {% if error %}
    <div class="q-pa-md q-mb-md bg-red-3 text-white rounded-borders">{{ error }}</div>
  {% endif %}
  <form method="post">
    <q-input id="password" name="password" label="Nova contrasenya" type="password" required autofocus />
    <q-input id="confirm_password" name="confirm_password" label="Confirma la contrasenya" type="password" required />
    <q-card-actions class="q-pt-md">
      <q-btn color="primary" unelevated type="submit" label="Canvia la contrasenya" />
    </q-card-actions>
  </form>
  <q-btn flat href="{{ url_for('admin.login') }}" label="Tornar al login" class="q-mt-sm" />
</q-card>
{% endblock %}
