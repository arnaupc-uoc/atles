{% extends "base.html" %}

{% block title %}Login - Atles Administració{% endblock %}

{% block content %}
<v-card elevation="2" class="pa-6 mx-auto" style="max-width: 520px;">
  <v-card-title>Iniciar sessió</v-card-title>
  {% if error %}
    <v-alert type="error" class="mb-4" prominent>{{ error }}</v-alert>
  {% endif %}
  <form method="post">
    <v-text-field id="username" name="username" label="Usuari" required autofocus></v-text-field>
    <v-text-field id="password" name="password" label="Contrasenya" type="password" required></v-text-field>
    <v-card-actions class="pt-4">
      <v-btn color="primary" type="submit">Entrar</v-btn>
    </v-card-actions>
  </form>

  <v-card-subtitle class="mt-4">Usuari per defecte: <strong>admin</strong> / contrasenya: <strong>admin</strong></v-card-subtitle>
  <v-btn variant="text" href="{{ url_for('admin.recover_password') }}">Has oblidat la contrasenya?</v-btn>
</v-card>
{% endblock %}
