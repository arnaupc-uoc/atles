{% extends "base.html" %}

{% block title %}Recuperar contrasenya - Atles Administració{% endblock %}

{% block content %}
<q-card elevation="2" class="q-pa-lg q-mx-auto" style="max-width: 520px;">
  <q-card-section class="text-h6">Recuperar contrasenya</q-card-section>
  {% if message %}
    <div class="q-pa-md q-mb-md bg-yellow-3 text-black rounded-borders">{{ message }}</div>
  {% endif %}
  <form method="post">
    <q-input id="email" name="email" label="Adreça de correu electrònic" type="email" required autofocus />
    <q-card-actions class="q-pt-md">
      <q-btn color="primary" unelevated type="submit" label="Enviar instruccions" />
    </q-card-actions>
  </form>
  <q-btn flat href="{{ url_for('admin.login') }}" label="Tornar al login" class="q-mt-sm" />
</q-card>
{% endblock %}
