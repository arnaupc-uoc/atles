{% extends "base.html" %}

{% block title %}Recuperar contrasenya - Atles Administració{% endblock %}

{% block content %}
<div class="card">
  <h1>Recuperar contrasenya</h1>
  {% if message %}
  <div class="alert warning">{{ message }}</div>
  {% endif %}
  <form method="post">
    <label for="email">Adreça de correu electrònic</label>
    <input id="email" name="email" type="email" required autofocus />
    <button class="button" type="submit">Enviar instruccions</button>
  </form>
  <p style="margin-top: 1rem;"><a href="{{ url_for('admin.login') }}">Tornar al login</a></p>
</div>
{% endblock %}
