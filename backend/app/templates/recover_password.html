{% extends "base.html" %}

{% block title %}Recuperar contrasenya - Atles Administració{% endblock %}

{% block content %}
<v-card elevation="2" class="pa-6 mx-auto" style="max-width: 520px;">
  <v-card-title>Recuperar contrasenya</v-card-title>
  {% if message %}
    <v-alert type="warning" class="mb-4" prominent>{{ message }}</v-alert>
  {% endif %}
  <form method="post">
    <v-text-field id="email" name="email" label="Adreça de correu electrònic" type="email" required autofocus></v-text-field>
    <v-card-actions class="pt-4">
      <v-btn color="primary" type="submit">Enviar instruccions</v-btn>
    </v-card-actions>
  </form>
  <v-btn variant="text" href="{{ url_for('admin.login') }}">Tornar al login</v-btn>
</v-card>
{% endblock %}
