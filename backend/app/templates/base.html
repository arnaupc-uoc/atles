<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Atles Administració{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quasar@2.12.0/dist/quasar.prod.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@quasar/extras/material-icons/material-icons.css">
    <style>
      [v-cloak] { display: none; }
    </style>
  </head>
  <body>
    <div id="backend-app" v-cloak>
      <q-layout view="hHh lpR fFf">
        <q-header elevated class="bg-primary text-white">
          <q-toolbar class="q-pl-xs q-pr-xs">
            <a href="{{ url_for('admin.home') }}" class="row items-center no-wrap text-white no-underline">
              <q-img
                src="{{ url_for('static', filename='img/logo.png') }}"
                alt="Logo Atles"
                style="width:48px; height:28px;"
                contain
              />
              <span class="text-h6 q-ml-sm">Atles Administració</span>
            </a>

            <q-space />

            {% if current_user.is_authenticated %}
              <div class="row items-center q-gutter-sm">
                <q-btn flat icon="settings" color="white" href="/config" round>
                  <q-tooltip anchor="bottom middle">Configuració</q-tooltip>
                </q-btn>

                <q-btn flat icon="logout" color="white" href="{{ url_for('admin.logout') }}" round>
                  <q-tooltip anchor="bottom middle">Sortir</q-tooltip>
                </q-btn>
              </div>
            {% endif %}
          </q-toolbar>
        </q-header>

        <q-page-container>
          <q-page class="q-pa-xl" style="max-width: 1280px; margin: 0 auto;">
            {% for category, message in get_flashed_messages(with_categories=true) %}
              <div class="q-pa-md q-mb-md bg-grey-2 text-black rounded-borders">
                {{ message }}
              </div>
            {% endfor %}

            {% block breadcrumbs %}{% endblock %}

            {% block content %}{% endblock %}
          </q-page>
        </q-page-container>

        <admin-dialog
          v-model="drawer.open"
          :title="drawer.title"
          :message="drawer.message"
          :has-action="!!drawer.action"
          @confirm="confirmDrawerAction"
        />
      </q-layout>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quasar@2.12.0/dist/quasar.umd.prod.js"></script>
    <script type="application/json" id="backend-app-data">{% block script_data %}{"filters": {}}{% endblock %}</script>
    <script type="module">
      import AdminFilters from "{{ url_for('static', filename='js/components/AdminFilters.js') }}";
      import AdminTable from "{{ url_for('static', filename='js/components/AdminTable.js') }}";
      import AdminDialog from "{{ url_for('static', filename='js/components/AdminDialog.js') }}";

      const backendAppData = (() => {
        const element = document.getElementById('backend-app-data');
        try {
          return element ? JSON.parse(element.textContent) : { filters: {} };
        } catch (error) {
          console.error('Failed to parse backend app data', error);
          return { filters: {} };
        }
      })();

      const app = Vue.createApp({
        data() {
          return {
            ...backendAppData,
            tableSearch: backendAppData.tableSearch || '',
            drawer: {
              open: false,
              title: '',
              message: '',
              action: null,
              href: '',
            },
          };
        },
        methods: {
          openDrawer(title, message, href) {
            this.drawer.title = title;
            this.drawer.message = message;
            this.drawer.href = href;
            this.drawer.action = true;
            this.drawer.open = true;
          },
          confirmDrawerAction() {
            if (this.drawer.href) {
              window.location.href = this.drawer.href;
            }
            this.drawer.open = false;
          },
        },
      });

      // Registrem components importats abans de fer el mount
      app.component('admin-filters', AdminFilters);
      app.component('admin-table', AdminTable);
      app.component('admin-dialog', AdminDialog);

      app.use(Quasar);
      app.mount('#backend-app');
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
