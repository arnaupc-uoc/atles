<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Atles Administració{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vuetify@4.1.0/dist/vuetify.min.css">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@5.x/css/materialdesignicons.min.css" rel="stylesheet">
    <style>
      html, body { min-height: 100%; margin: 0; }
      body { font-family: Roboto, system-ui, sans-serif; background: #f5f5f5; }
      #backend-app { min-height: 100vh; }
      [v-cloak] { display: none; }
      .breadcrumbs { margin-bottom: 1rem; font-size: 0.95rem; color: #4b5563; }
      .breadcrumbs a { color: inherit; text-decoration: none; }
      .breadcrumbs span { margin: 0 0.5rem; }
      .v-data-table { width: 100%; }
      .v-data-table th, .v-data-table td { padding: 12px 16px; }
      .drawer-top { height: auto; max-height: 80vh; }
      .border-b { border-bottom: 1px solid rgba(0, 0, 0, 0.12); }
    </style>
  </head>
  <body>
    <div id="backend-app" v-cloak>
      <v-app>
        <v-app-bar color="primary" dark elevated>
          <a href="{{ url_for('admin.home') }}" class="d-inline-flex align-center text-decoration-none ml-4">
            <v-img
              src="{{ url_for('static', filename='img/logo.png') }}"
              alt="Logo Atles"
              width="48px"
              height="28px"
              class="mr-2"
              contain
            ></v-img>
            <span class="text-title-large text-white font-weight-medium">Atles Administració</span>
          </a>

          <v-spacer></v-spacer>

          {% if current_user.is_authenticated %}
            <div class="d-flex ga-2 mr-4">

              <v-tooltip location="bottom">
                <template #activator="{ props }">
                  <v-btn
                    v-bind="props"
                    icon="mdi-cog"
                    variant="text"
                    color="white"
                    href="/config"
                    class="rounded-circle"
                  ></v-btn>
                </template>
                <span>Configuració</span>
              </v-tooltip>

              <v-tooltip location="bottom">
                <template #activator="{ props }">
                  <v-btn
                    v-bind="props"
                    icon="mdi-logout"
                    variant="text"
                    color="white"
                    href="{{ url_for('admin.logout') }}"
                    class="rounded-circle"
                  ></v-btn>
                </template>
                <span>Sortir</span>
              </v-tooltip>

            </div>
          {% endif %}
        </v-app-bar>
        <v-main>
          <v-container fluid class="pa-6 pb-16" style="max-width: 1280px;">
            {% for category, message in get_flashed_messages(with_categories=true) %}
              <v-alert variant="tonal" type="{{ category }}" class="mb-4" prominent>
                {{ message }}
              </v-alert>
            {% endfor %}

            {% block breadcrumbs %}{% endblock %}

            {% block content %}{% endblock %}

          </v-container>
        </v-main>
        <admin-dialog
          v-model="drawer.open"
          :title="drawer.title"
          :message="drawer.message"
          :has-action="!!drawer.action"
          @confirm="confirmDrawerAction"
        ></admin-dialog>
      </v-app>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@4.1.0/dist/vuetify.min.js"></script>
    <script type="application/json" id="backend-app-data">{% block script_data %}{"filters": {}}{% endblock %}</script>
    <script type="module">
      import AdminFilters from "{{ url_for('static', filename='js/components/AdminFilters.js') }}";
      import AdminTable from "{{ url_for('static', filename='js/components/AdminTable.js') }}";
      import AdminDialog from "{{ url_for('static', filename='js/components/AdminDialog.js') }}";

      const backendAppData = (() => {
        const element = document.getElementById('backend-app-data');
        try {
          return element ? JSON.parse(element.textContent) : { filters: {} };
        } catch (error) {
          console.error('Failed to parse backend app data', error);
          return { filters: {} };
        }
      })();
      const app = Vue.createApp({
        data() {
          return {
            ...backendAppData,
            tableSearch: backendAppData.tableSearch || '',
            drawer: {
              open: false,
              title: '',
              message: '',
              action: null,
              href: '',
            },
          };
        },
        methods: {
          openDrawer(title, message, href) {
            this.drawer.title = title;
            this.drawer.message = message;
            this.drawer.href = href;
            this.drawer.action = true;
            this.drawer.open = true;
          },
          confirmDrawerAction() {
            if (this.drawer.href) {
              window.location.href = this.drawer.href;
            }
            this.drawer.open = false;
          },
        },
      });

      // Registrem components importats abans de fer el mount
      app.component('admin-filters', AdminFilters);
      app.component('admin-table', AdminTable);
      app.component('admin-dialog', AdminDialog);

      const vuetify = Vuetify.createVuetify();
      app.use(vuetify);
      const vm = app.mount('#backend-app');
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
