<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Atles Administració{% endblock %}</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 0; background: #f4f5f7; color: #1f2937; }
      header { background: #1f2937; color: white; padding: 1rem 1.5rem; }
      header a { color: white; text-decoration: none; margin-right: 1rem; }
      main { padding: 1.5rem; }
      .card { background: white; border-radius: 12px; box-shadow: 0 8px 24px rgba(31, 41, 55, 0.08); padding: 1.5rem; margin-bottom: 1rem; }
      .button { display: inline-flex; align-items: center; justify-content: center; background: #2563eb; color: white; border: none; border-radius: 8px; padding: 0.75rem 1rem; text-decoration: none; cursor: pointer; }
      .button.secondary { background: #6b7280; }
      .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
      .alert { padding: 1rem; border-radius: 10px; margin-bottom: 1rem; }
      select { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 8px; margin-top: 0.5rem; background: white; }
      .alert.info { background: #e0f2fe; color: #0369a1; }
      .alert.warning { background: #fef3c7; color: #92400e; }
      .alert.error { background: #fee2e2; color: #991b1b; }
      form input { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 8px; margin-top: 0.5rem; }
      form label { display: block; margin-top: 1rem; font-weight: 600; }
      form button { margin-top: 1.25rem; }
      .breadcrumbs { margin-bottom: 1rem; font-size: 0.95rem; color: #4b5563; }
      .breadcrumbs a { color: #2563eb; text-decoration: none; }
      .breadcrumbs span { margin: 0 0.5rem; }
      .table-wrapper { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
      th,
      td { text-align: left; padding: 0.85rem 0.75rem; border-bottom: 1px solid #e5e7eb; }
      th { background: #f9fafb; font-weight: 700; }
      tbody tr:hover { background: #f3f4f6; }
      .pagination { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
      .page-link { display: inline-flex; align-items: center; justify-content: center; padding: 0.6rem 0.9rem; border-radius: 999px; text-decoration: none; background: #e5e7eb; color: #1f2937; }
      .page-link.active { background: #2563eb; color: white; }
      .summary { margin-top: 0.75rem; color: #4b5563; font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <header>
      <a href="{{ url_for('admin.home') }}">Atles Administració</a>
      {% if current_user.is_authenticated %}
      <a href="{{ url_for('admin.logout') }}" class="button secondary">Sortir</a>
      {% endif %}
    </header>
    <main>
      {% for category, message in get_flashed_messages(with_categories=true) %}
        <div class="alert {{ category }}">{{ message }}</div>
      {% endfor %}
      {% block breadcrumbs %}{% endblock %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
