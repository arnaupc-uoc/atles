<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Atles Administració{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vuetify@3/dist/vuetify.min.css">
    <style>
      html, body { min-height: 100%; margin: 0; }
      body { font-family: Roboto, system-ui, sans-serif; background: #f5f5f5; }
      #backend-app { min-height: 100vh; }
      [v-cloak] { display: none; }
      .breadcrumbs { margin-bottom: 1rem; font-size: 0.95rem; color: #4b5563; }
      .breadcrumbs a { color: inherit; text-decoration: none; }
      .breadcrumbs span { margin: 0 0.5rem; }
      .v-data-table { width: 100%; }
      .v-data-table th, .v-data-table td { padding: 12px 16px; }
    </style>
  </head>
  <body>
    <div id="backend-app" v-cloak>
      <v-app>
        <v-app-bar color="primary" dark elevated>
          <v-app-bar-title>Atles Administració</v-app-bar-title>
          <v-spacer></v-spacer>
          {% if current_user.is_authenticated %}
            <v-btn variant="text" color="white" href="{{ url_for('admin.logout') }}">Sortir</v-btn>
          {% endif %}
        </v-app-bar>
        <v-main>
          <v-container fluid class="pa-6">
            {% for category, message in get_flashed_messages(with_categories=true) %}
              <v-alert variant="tonal" type="{{ category }}" class="mb-4" prominent>
                {{ message }}
              </v-alert>
            {% endfor %}
            {% block breadcrumbs %}{% endblock %}
            {% block content %}{% endblock %}
          </v-container>
        </v-main>
      </v-app>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@3/dist/vuetify.min.js"></script>
    <script type="application/json" id="backend-app-data">{% block script_data %}{"filters": {}}{% endblock %}</script>
    <script>
      const backendAppData = (() => {
        const element = document.getElementById('backend-app-data');
        try {
          return element ? JSON.parse(element.textContent) : { filters: {} };
        } catch (error) {
          console.error('Failed to parse backend app data', error);
          return { filters: {} };
        }
      })();
      const app = Vue.createApp({
        data() {
          return backendAppData;
        },
      });
      const vuetify = Vuetify.createVuetify();
      app.use(vuetify);
      const vm = app.mount('#backend-app');
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
